<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanhai Infracon ERP</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f5f9;color:#17243a}
header{background:#142b49;color:white;padding:15px;font-weight:bold}
.layout{display:flex;min-height:90vh}
aside{width:230px;background:#10213b;padding:12px;flex-shrink:0}
aside button{display:block;width:100%;padding:12px;margin:4px 0;border:0;border-radius:5px;text-align:left;background:#203957;color:white}
aside button:hover{background:#009c91}
main{flex:1;padding:18px;min-width:0}
.card{background:white;padding:16px;border-radius:10px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
input,select,textarea{width:100%;padding:10px;margin:5px 0 12px;border:1px solid #ccd5e1;border-radius:5px}
label{font-size:13px;font-weight:bold}
.btn{padding:11px 16px;border:0;border-radius:5px;background:#009c91;color:white;font-weight:bold}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}
.tablebox{overflow-x:auto}
.hidden{display:none!important}
img.proof{width:55px;height:55px;object-fit:cover}
#login{max-width:400px;margin:60px auto;padding:25px}
@media(max-width:700px){
 .layout{display:block}
 aside{width:100%;display:flex;overflow-x:auto;gap:5px}
 aside button{min-width:130px;width:auto}
 main{padding:10px}
}
</style>
</head>

<body>

<script>
function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const loginMsg = document.getElementById("loginMsg");

    if (username === "admin" && password === "admin123") {
        document.getElementById("login").style.display = "none";
        document.getElementById("app").classList.remove("hidden");
        loginMsg.textContent = "";
    } else if (username === "site" && password === "site123") {
        document.getElementById("login").style.display = "none";
        document.getElementById("app").classList.remove("hidden");
        loginMsg.textContent = "";
    } else {
        loginMsg.textContent = "Invalid username or password!";
        loginMsg.style.color = "red";
    }</script>
}
</script>

<div id="app" class="hidden">
<header>🏗️ KANHAI INFRACON | SITE ERP</header>

<div class="layout">
<aside>
<button onclick="page('dashboard')">📊 Dashboard</button>
<button onclick="page('projects')">🏗️ Projects & Sites</button>
<button onclick="page('dpr')">📋 DPR Report</button>
<button onclick="page('dlr')">👷 DLR / Labour</button>
<button onclick="page('billing')">🧾 Billing & BOQ</button>
<button onclick="page('concrete')">🧱 Concrete Calculator</button>
<button onclick="page('bbs')">🔩 BBS / Steel</button>
<button onclick="page('inventory')">📦 Inventory / Store</button>
<button onclick="page('purchase')">🛒 Purchase</button>
<button onclick="page('accounts')">💰 Accounts</button>
<button onclick="page('quality')">✅ QA/QC Department</button>
<button onclick="page('safety')">🦺 Safety / HSE</button>
<button onclick="page('planning')">📅 Planning</button>
<button onclick="page('hr')">👷 HR / Manpower</button>
<button onclick="page('documents')">📁 Documents</button>
<button onclick="page('reports')">📈 Reports / Backup</button>
<button onclick="page('admin')">⚙️ Admin / Core Departments</button>
<button onclick="logout()">Logout</button>
</aside>

<main id="content"></main>
</div>
</div>

<script>
const users={admin:'admin123',site:'site123'};
let currentUser='';
const DB='kanhai_erp_records_v1';

function getDB(){
 try{return JSON.parse(localStorage.getItem(DB))||{}}
 catch(e){return {}}
}
function saveDB(d){
 localStorage.setItem(DB,JSON.stringify(d));
}
function records(k){return getDB()[k]||[]}

function login(){
 let u=document.getElementById('username').value.trim();
 let p=document.getElementById('password').value;
 if(users[u]===p){
  currentUser=u;
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  page('dashboard');
 }else{
  document.getElementById('loginMsg').textContent='Wrong username or password';
 }
}
function logout(){
 currentUser='';
 document.getElementById('app').classList.add('hidden');
 document.getElementById('login').classList.remove('hidden');
}
function esc(v){
 return String(v??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}
function saveRecord(k,r){
 let d=getDB();
 d[k]=d[k]||[];
 r.id=Date.now().toString()+Math.random().toString(16).slice(2);
 r.createdBy=currentUser;
 d[k].push(r);
 saveDB(d);
}
function del(k,id){
 if(!confirm('Delete this record?'))return;
 let d=getDB();
 d[k]=(d[k]||[]).filter(r=>r.id!==id);
 saveDB(d);
 page(k);
}
function table(k,fields){
 let data=records(k);
 if(!data.length)return '<p>No records saved yet.</p>';
 return '<div class="tablebox"><table><tr>'+
 fields.map(f=>'<th>'+f[1]+'</th>').join('')+
 '<th>Photos</th><th>Action</th></tr>'+
 data.slice().reverse().map(r=>'<tr>'+
 fields.map(f=>'<td>'+esc(r[f[0]]||'—')+'</td>').join('')+
 '<td>'+(r.photos||[]).map(p=>
 '<a href="'+p+'" target="_blank">View photo</a>'
 ).join('<br>')+'</td>'+
 '<td><button onclick="del(\\''+k+'\\',\\''+r.id+'\\')">Delete</button></td>'+
 '</tr>').join('')+'</table></div>';
}
function form(k,title,fields){
 return '<section class="card"><h2>'+title+'</h2>'+
 '<form id="recordForm">'+fields+
 '<label>Attach Photo / Bill Proof</label>'+
 '<input type="file" id="photos" accept="image/*" multiple>'+
 '<button class="btn" type="submit">💾 Save Record</button>'+
 '</form></section>'+
 '<section class="card"><h2>Saved Records</h2>'+
 table(k,[['date','Date'],['project','Project / Site'],['item','Item / Activity'],['amount','Amount'],['status','Status']])+
 '</section>';
}
function inp(label,name,type='text',required=true){
 return '<label>'+label+'</label><input name="'+name+'" type="'+type+'" '+(required?'required':'')+'>';
}
function sel(label,name,opts){
 return '<label>'+label+'</label><select name="'+name+'" required>'+
 '<option value="">Select</option>'+
 opts.map(o=>'<option>'+o+'</option>').join('')+'</select>';
}
function area(label,name){
 return '<label>'+label+'</label><textarea name="'+name+'"></textarea>';
}
function bind(k){
 const f=document.getElementById('recordForm');
 if(!f)return;
 f.onsubmit=async e=>{
  e.preventDefault();
  const b=f.querySelector('button[type=submit]');
  b.disabled=true;
  b.textContent='Saving...';
  try{
   let r=Object.fromEntries(new FormData(f).entries());
   r.photos=[];
   const files=[...document.getElementById('photos').files];
   for(const file of files){
    if(file.size>800000){
     alert('Photo 800 KB se chhoti rakhein.');
     b.disabled=false;b.textContent='💾 Save Record';return;
    }
    r.photos.push(await new Promise((resolve,reject)=>{
     const rd=new FileReader();
     rd.onload=()=>resolve(rd.result);
     rd.onerror=reject;
     rd.readAsDataURL(file);
    }));
   }
   saveRecord(k,r);
   alert('Record saved successfully!');
   page(k);
  }catch(err){
   alert('Save nahi hua. Photo chhoti karke try karein.');
   b.disabled=false;b.textContent='💾 Save Record';
  }
 };
}
function page(k){
 const c=document.getElementById('content');
 const date=new Date().toISOString().slice(0,10);
 if(k==='dashboard'){
  c.innerHTML='<h2>Dashboard</h2><div class="card"><h3>Welcome '+esc(currentUser)+'</h3>'+
  '<p>Projects: '+records('projects').length+
  ' | DPR: '+records('dpr').length+
  ' | Bills: '+records('billing').length+
  ' | Materials: '+records('inventory').length+'</p></div>'+
  '<div class="card"><h3>Recent Billing</h3>'+
  table('billing',[['date','Date'],['project','Project'],['item','BOQ Item'],['amount','Amount'],['status','Status']])+
  '</div>';
  return;
 }
 if(k==='concrete'){
  c.innerHTML='<section class="card"><h2>Concrete Calculator</h2>'+
  inp('Length (m)','length')+inp('Width (m)','width')+
  inp('Depth (m)','depth')+
  '<button class="btn" onclick="calcConcrete()">Calculate</button>'+
  '<h3 id="result"></h3></section>';
  return;
 }
 if(k==='bbs'){
  c.innerHTML='<section class="card"><h2>BBS Steel Calculator</h2>'+
  sel('Diameter (mm)','dia',['8','10','12','16','20','25','32'])+
  inp('Length per bar (m)','length','number')+
  inp('Number of bars','qty','number')+
  '<button class="btn" onclick="calcSteel()">Calculate</button>'+
  '<h3 id="result"></h3></section>';
  return;
 }
 if(k==='reports'){
  c.innerHTML='<section class="card"><h2>Reports & Backup</h2>'+
  '<button class="btn" onclick="backup()">Download JSON Backup</button> '+
  '<button class="btn" onclick="csv()">Export All Records CSV</button>'+
  '<p>Backup ko safe jagah par rakhein.</p></section>';
  return;
 }
 if(k==='admin'){
  c.innerHTML='<section class="card"><h2>Core Departments</h2>'+
  '<p>Project / Execution: RCC, Masonry, Finishing, Survey</p>'+
  '<p>QA/QC: Steel, Shuttering, Cube Test, Material Test</p>'+
  '<p>Safety / HSE: PPE, Toolbox Talk, Incident, Corrective Action</p>'+
  '<p>Store / Purchase: Inward, Outward, Vendor, Purchase Order</p>'+
  '<p>Accounts: BOQ, RA Bill, Final Bill, GST, Expenses</p>'+
  '<p>HR: Employees, Attendance, Overtime, Payroll</p>'+
  '<p>Planning: Schedule, Targets, Progress, Delays</p>'+
  '<p>Documents: Structural Drawings, RFI, MIR, WIR</p>'+
  '<p><b>Demo only:</b> Login browser mein hota hai; shared database abhi connect nahi hai.</p></section>';
  return;
 }
 let title='',fields='';
 switch(k){
 case 'projects':
 title='Projects & Sites';
 fields=inp('Date','date','date')+inp('Project / Site Name','project')+
 inp('Client / PMC','item')+inp('Location','location')+sel('Status','status',['Planning','In Progress','On Hold','Completed']);
 break;
 case 'billing':
 title='Billing & BOQ';
 fields=inp('Date','date','date')+inp('Project / Site','project')+
 inp('BOQ Item / Description','item')+inp('Bill / Voucher No.','billNo')+
 inp('Quantity','quantity','number')+
 sel('Unit','unit',['Nos','Kg','MT','Ton','RMT','RFT','Sq.ft','Sq.m','Cum'])+
 inp('Rate ₹','rate','number')+
 sel('Bill Type','billType',['RA Bill','Final Bill','Subcontractor Bill','Material Bill','Petty Cash Voucher'])+
 sel('Status','status',['Draft','Submitted','Approved','Paid','Rejected'])+
 inp('GST %','gst','number',false)+area('Remarks','remarks');
 break;
 case 'dpr':
 title='Daily Progress Report';
 fields=inp('Date','date','date')+inp('Project / Site','project')+
 inp('Work Activity','item')+inp('Quantity Completed','quantity','number',false)+
 inp('Manpower','manpower','number',false)+area('Work Details','remarks');
 break;
 case 'dlr':
 title='Daily Labour Report';
 fields=inp('Date','date','date')+inp('Project / Site','project')+
 inp('Contractor','item')+inp('Mason','mason','number',false)+
 inp('Helper','helper','number',false)+inp('Carpenter','carpenter','number',false)+area('Remarks','remarks');
 break;
 case 'inventory':
 title='Inventory / Store';
 fields=inp('Date','date','date')+inp('Project / Site','project')+
 inp('Material Name','item')+sel('Transaction','status',['Inward','Outward','Return'])+
 inp('Quantity','quantity','number')+inp('Unit','unit')+inp('Supplier / Issued To','party');
 break;
 case 'purchase':
 title='Purchase Request';
 fields=inp('Date','date','date')+inp('Project / Site','project')+
 inp('Material / Item','item')+inp('Quantity','quantity','number')+
 inp('Vendor','vendor')+sel('Status','status',['Requested','Approved','Ordered','Received']);
 break;
 case 'accounts':
 title='Accounts & Expenses';
 fields=inp('Date','date','date')+inp('Project / Site','project')+
 sel('Type','status',['Expense','Payment','Receipt','Advance'])+
 inp('Category','item')+inp('Amount ₹','amount','number')+
 inp('Party','party')+area('Remarks','remarks');
 break;
 case 'quality':
 title='Quality Control';
 fields=inp('Date','date','date')+inp('Project / Site','project')+
 sel('Inspection','item',['Steel Inspection','Shuttering','Concrete Pour','Cube Test','Material Test'])+
 sel('Result','status',['Accepted','Rejected','Observation'])+area('Remarks','remarks');
 break;
 case 'safety':
 title='Safety / HSE';
 fields=inp('Date','date','date')+inp('Project / Site','project')+
 sel('Report Type','item',['PPE Check','Toolbox Talk','Near Miss','Incident'])+
 sel('Status','status',['Open','Action Assigned','Closed'])+area('Observation','remarks');
 break;
 case 'planning':
 title='Planning & Schedule';
 fields=inp('Date','date','date')+inp('Project / Site','project')+
 inp('Activity','item')+inp('Target Date','targetDate','date')+
 inp('Progress %','quantity','number')+
 sel('Status','status',['Not Started','In Progress','Delayed','Completed']);
 break;
 case 'hr':
 title='HR / Manpower';
 fields=inp('Employee Name','project')+inp('Employee ID','item')+
 inp('Designation','designation')+inp('Department','department')+
 inp('Contractor','contractor')+sel('Status','status',['Active','Inactive','On Leave']);
 break;
 case 'documents':
 title='Documents & Drawings';
 fields=inp('Date','date','date')+inp('Project / Site','project')+
 inp('Drawing / Document Title','item')+inp('Drawing No. / Revision','drawingNo')+
 sel('Document Type','status',['Structural Drawing','Architectural Drawing','RFI','MIR','WIR','Test Report']);
 break;
 default:
 title=k.toUpperCase();
 fields=inp('Date','date','date')+inp('Project / Site','project')+
 inp('Activity / Item','item')+inp('Amount / Quantity','amount','number',false)+
 sel('Status','status',['Open','In Progress','Completed'])+area('Remarks','remarks');
 }
 c.innerHTML='<h2>'+title+'</h2><section class="card"><form id="recordForm">'+
 fields+'<label>Attach Photo / Bill Proof</label>'+
 '<input type="file" id="photos" accept="image/*" multiple>'+
 '<button class="btn" type="submit">💾 Save Record</button></form></section>'+
 '<section class="card"><h3>Saved Records</h3>'+
 table(k,[['date','Date'],['project','Project / Site'],['item','Item / Activity'],['amount','Amount'],['status','Status']])+
 '</section>';
 bind(k);
}
function calcConcrete(){
 let l=+document.querySelector('[name=length]').value;
 let w=+document.querySelector('[name=width]').value;
 let d=+document.querySelector('[name=depth]').value;
 if(l<=0||w<=0||d<=0){alert('Valid dimensions enter karein');return}
 document.getElementById('result').textContent='Concrete = '+(l*w*d).toFixed(3)+' m³';
}
function calcSteel(){
 let d=+document.querySelector('[name=dia]').value;
 let l=+document.querySelector('[name=length]').value;
 let n=+document.querySelector('[name=qty]').value;
 if(l<=0||n<=0){alert('Valid length aur quantity enter karein');return}
 document.getElementById('result').textContent='Steel weight = '+(d*d/162*l*n).toFixed(2)+' kg';
}
function download(name,text,type){
 let a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([text],{type:type}));
 a.download=name;a.click();
}
function backup(){
 download('kanhai-erp-backup.json',JSON.stringify(getDB(),null,2),'application/json');
}
function csv(){
 let d=getDB(),lines=['Department,Date,Project,Item,Amount,Status'];
 Object.keys(d).forEach(k=>(d[k]||[]).forEach(r=>{
  lines.push([k,r.date,r.project,r.item,r.amount,r.status]
  .map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','));
 }));
 download('kanhai-erp-report.csv',lines.join('\r\n'),'text/csv');
}
</script>
</body>
</html>
